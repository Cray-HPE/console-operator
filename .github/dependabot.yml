# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Cray-HPE/Cray-Management-Systems"
    labels:
      - "github-actions-deps"
      - "dependabot"
    open-pull-requests-limit: 16
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    assignees:
      - "Cray-HPE/Cray-Management-Systems"
    labels:
      - "go-deps"
      - "dependabot"
    open-pull-requests-limit: 16
    groups:
      k8s:
        applies-to: "security-updates"
        patterns: [ "k8s.io/*" ]
      k8s:
        applies-to: "version-updates"
        patterns: [ "k8s.io/*" ]
      protobuf:
        applies-to: "security-updates"
        patterns: [ "github.com/golang/protobuf", "golang.org/protobuf", "google.golang.org/protobuf" ]
      protobuf:
        applies-to: "version-updates"
        patterns: [ "github.com/golang/protobuf", "golang.org/protobuf", "google.golang.org/protobuf" ]
      x:
        applies-to: "security-updates"
        patterns: [ "github.com/golang/x/*", "golang.org/x/*", "google.golang.org/x/*" ]
      x:
        applies-to: "version-updates"
        patterns: [ "github.com/golang/x/*", "golang.org/x/*", "google.golang.org/x/*" ]
    allow:
      # Allow updates to both direct and indirect dependencies
      - dependency-type: "all"
    ignore:
      # Block routine version updates
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
